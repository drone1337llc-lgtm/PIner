[platformio]
default_envs = esp32dev, ttgo-t-display, esp32-c3-devkitc-02

[env:esp32-c3-devkitc-02]
platform = espressif32@6.7.0
board = esp32-c3-devkitc-02
framework = arduino

monitor_speed = 115200
upload_speed = 256000

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -D esp32c3=1

; Important for C3
board_build.flash_mode = dio
board_build.f_cpu = 160000000L

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino

board_build.stack_size = 0x2000      ; 8KB default stack
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D esp32dev=1
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -D CONFIG_ARDUINO_SETUP_STACK_SIZE=8192
    -D CONFIG_FREERTOS_MINIMAL_STACK_SIZE=1024
    -D CONFIG_COMPILER_OPTIMIZATION_PERF=y
    -D CONFIG_FREERTOS_HZ=1000
    -D MINING_STACK_SIZE=10240 
    -O2

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 256000

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

[env:ttgo-t-display]
platform = espressif32@6.7.0
board = ttgo-t1
framework = arduino

lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43

build_flags = 
    -D LCD=1
    -D USER_SETUP_ID=25
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -D CONFIG_ARDUINO_SETUP_STACK_SIZE=8192
    -D CONFIG_FREERTOS_MINIMAL_STACK_SIZE=1024
    -D CONFIG_COMPILER_OPTIMIZATION_PERF=y
    -D CONFIG_FREERTOS_HZ=1000
    -D MINING_STACK_SIZE=10240 
    -O2
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
upload_speed = 256000

