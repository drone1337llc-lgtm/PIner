[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -O3
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    lovyan03/LovyanGFX @ ^1.1.12