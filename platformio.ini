[platformio]
default_envs= ESP32_Touch_LCD_3_5, IdeaSparkESP32s3

[env:ESP32_Touch_LCD_3_5]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.psram = enabled
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.flash_mode = dio
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D TFT_CS=5
    -D TFT_DC=27
    -D TFT_SCLK=18
    -D TFT_MOSI=23
    -D TFT_MISO=19
    -D TFT_BL=25
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    lovyan03/LovyanGFX @ ^1.1.12

[env:IdeaSparkESP32s3]
platform = espressif32 @ 6.7.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
extra_scripts = 
	pre:auto_firmware_version.py
	post:scripts/save_firmware_for_ota.py
monitor_filters = 
	esp32_exception_decoder
	time
	log2file
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags = 
	-Wno-error=return-type
    -D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D IdeaSparkS3=1
	-D BOARD_HAS_PSRAM
	-D USER_SETUP_LOADED=1
	-D ST7789_2_DRIVER=1
	-D TFT_WIDTH=170
	-D TFT_HEIGHT=320
	-D TFT_MISO=-1
	-D TFT_MOSI=23
	-D TFT_SCLK=18
	-D TFT_CS=15
	-D TFT_DC=2
	-D TFT_RST=4
	-D TOUCH_CS=-1
	-D TFT_BL=32
	-D TFT_BACKLIGHT_ON=HIGH
	-D TFT_RGB_ORDER=TFT_RGB
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=40000000
	-D SPI_READ_FREQUENCY=20000000
	-D FIRMWARE_URL=http://192.168.68.28/firmware//IdeaSparkESP32s3firmware.bin
lib_deps = 
	tzapu/WiFiManager @ ^2.0.17
	ayushsharma82/ElegantOTA@^3.1.7
	mathertel/OneButton@^2.6.2
	arduino-libraries/NTPClient@^3.2.1
	fscii/OpenFontRender@^1.0.0
	robtillaart/TCA9554@^0.1.3
	bblanchon/ArduinoJson@^7.2.2
lib_ignore = 
	SD